# Docker Compose for the Calhau bot and its Postgres database, all on this machine.
# Setup: copy examples/bot/.env.example to examples/bot/.env and fill it in.
# The bot reads DATABASE_URL from that file for host scripts (import, tests). The
# container gets the in-network address below, which overrides the env file.
# The project name keeps this stack's volumes apart from other compose projects on the same engine.
name: persona

services:
  postgres:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: persona
      POSTGRES_USER: persona
      POSTGRES_PASSWORD: persona
    ports:
      # Published on localhost only, for host-side scripts such as the import.
      - "127.0.0.1:5439:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U persona -d persona" ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  persona-bot:
    build:
      context: ..
      dockerfile: examples/bot/Dockerfile
    env_file:
      - ../examples/bot/.env
    environment:
      DATABASE_URL: postgres://persona:persona@postgres:5432/persona
    volumes:
      - ../examples/bot/.auth:/app/examples/bot/.auth
      - ../examples/bot/data:/app/examples/bot/data
      # Downloaded models (embedding and chat), so they are fetched once, not on every container start.
      - ggml_cache:/home/bun/.cache/ggml-node
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  ggml_cache:
