# Docker Compose for local development (linked-device bot)
services:
  persona-bot:
    build:
      context: ..
      dockerfile: examples/persona/Dockerfile
    env_file:
      - ../examples/persona/.env
    volumes:
      - ../examples/persona/data:/app/examples/persona/data
      - ../examples/persona/.auth:/app/examples/persona/.auth
    restart: unless-stopped
